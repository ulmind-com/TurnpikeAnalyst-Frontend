<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leon Vasari — Filmography</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+JP:wght@500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #EDEBE6;
      --sheet: #F4F2ED;
      --ink: #141414;
      --muted: #6D6A63;
      --cobalt: #1F3FB0;
      --rule: rgba(20, 20, 20, 0.9);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --H: min(46vh, 31vw);
    }

    @media (max-width: 767px) {
      :root {
        --H: min(60vw, 40svh);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", "Noto Sans JP", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    @media (pointer: fine) {
      html, body, button, a {
        cursor: none !important;
      }
    }

    /* Paper Grain Layer */
    #grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      pointer-events: none;
      opacity: 0.55;
      mix-blend-mode: multiply;
    }

    /* Label tokens */
    .lbl {
      font-family: "Inter Tight", "Noto Sans JP", system-ui, sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      line-height: 1;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 21px;
      padding: 0 8px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      text-decoration: none;
    }

    /* 1. Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .top-left {
      justify-self: start;
      pointer-events: auto;
    }

    .top-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--cobalt);
      text-decoration: none;
      pointer-events: auto;
    }

    .logo-kanji {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: .04em;
      line-height: 1;
    }

    .logo-sub {
      font-family: "Inter Tight", sans-serif;
      font-weight: 600;
      font-size: 9px;
      letter-spacing: .34em;
      line-height: 1;
      padding-left: .34em;
    }

    .top-right {
      justify-self: end;
      color: var(--ink);
    }

    /* 2. Decade Tabs */
    .decade-nav {
      position: fixed;
      left: 50%;
      top: calc(50% - var(--H) / 2 - 86px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      z-index: 30;
    }

    .tabs-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .tab-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      height: 23px;
      background: var(--cobalt);
      z-index: 1;
      pointer-events: none;
      transition: transform 0.6s var(--ease), width 0.6s var(--ease);
    }

    .tab-btn {
      position: relative;
      z-index: 2;
      height: 23px;
      padding: 0 11px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      font-family: "Inter Tight", "Noto Sans JP", sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: .09em;
      text-transform: uppercase;
      white-space: nowrap;
      margin-left: -1px;
      cursor: pointer;
      transition: color 0.45s var(--ease);
    }

    .tab-btn.active {
      color: #ffffff;
    }

    /* 3. 3D Shelf */
    .shelf-section {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(50% - var(--H) / 2 - 40px);
      height: calc(var(--H) + 80px);
      perspective: 2200px;
      perspective-origin: 50% 50%;
      touch-action: pan-y;
      z-index: 20;
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .tape {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .face {
      position: absolute;
      height: var(--H);
      top: calc(-1 * var(--H) / 2);
      backface-visibility: hidden;
      border-radius: 2px;
      overflow: hidden;
      background-repeat: no-repeat;
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #000000;
      opacity: var(--shade, 0);
      pointer-events: none;
    }

    .face.sp {
      width: var(--ws);
      left: calc(-1 * var(--ws) / 2);
      transform: translateZ(calc(var(--d) / 2));
    }

    .face.cv {
      width: var(--d);
      left: calc(-1 * var(--d) / 2);
      transform: rotateY(90deg) translateZ(calc(var(--ws) / 2));
      box-shadow: 0 30px 60px -28px rgba(20, 16, 10, 0.55);
    }

    /* 4. Play Ring */
    .play-ring {
      position: fixed;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--cobalt);
      background: rgba(237, 235, 230, 0.75);
      color: var(--cobalt);
      display: grid;
      place-items: center;
      z-index: 35;
      cursor: pointer;
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center;
      transition: transform 0.2s var(--ease);
    }

    .play-ring svg {
      width: 12px;
      height: 12px;
      fill: var(--cobalt);
      transform: translateX(1.5px);
    }

    /* 5. Caption Stack */
    .caption-stack {
      position: fixed;
      left: 50%;
      top: calc(50% + var(--H) / 2 + 30px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      pointer-events: none;
      z-index: 25;
      text-align: center;
    }

    .caption-mask {
      overflow: hidden;
      position: relative;
      width: min(92vw, 760px);
      display: flex;
      justify-content: center;
    }

    .cap-title {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: 31px;
      line-height: 1.12;
      letter-spacing: -.01em;
      min-height: 36px;
    }

    .cap-sub {
      color: var(--cobalt);
      font-weight: 500;
      min-height: 16px;
    }

    .cap-year {
      font-family: "Inter Tight", sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .08em;
      min-height: 14px;
    }

    /* 6. Arrows */
    .arrow-btn {
      position: fixed;
      top: calc(50% + var(--H) / 2 + 40px);
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 30;
    }

    .arrow-btn.prev { left: 20px; }
    .arrow-btn.next { right: 20px; }

    /* 7. Footer */
    .footer {
      position: fixed;
      bottom: 26px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .footer a {
      pointer-events: auto;
      color: var(--ink);
      text-decoration: none;
    }

    /* 8. Custom Cursor */
    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 58px;
      margin: -29px 0 0 -29px;
      pointer-events: none;
      z-index: 100;
      display: grid;
      place-items: center;
      will-change: transform;
    }

    .cursor-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: transparent;
      transform: scale(1);
      transition: transform 0.5s var(--ease), background-color 0.4s var(--ease), border-color 0.4s var(--ease);
    }

    .cursor-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      transform: scale(1);
      transition: transform 0.4s var(--ease);
    }

    .cursor-label {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Inter Tight", "Noto Sans JP", sans-serif;
      font-weight: 600;
      font-size: 10px;
      line-height: 1.25;
      letter-spacing: .1em;
      color: #ffffff;
      transform: scale(0);
      transition: transform 0.45s var(--ease);
    }

    /* Cursor States */
    #cursor.spine .cursor-ring { transform: scale(0.72); }
    #cursor.btn .cursor-ring { transform: scale(0.55); }
    #cursor.btn .cursor-dot { transform: scale(0); }
    #cursor.open .cursor-ring {
      transform: scale(1.75);
      background-color: var(--cobalt);
      border-color: var(--cobalt);
    }
    #cursor.open .cursor-dot { transform: scale(0); }
    #cursor.open .cursor-label { transform: scale(1); }

    /* 9. Detail Dialog & Ink Reveal */
    .detail {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--sheet);
      visibility: hidden;
      overflow-y: auto;
      padding: 110px 6vw 56px 7vw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      align-items: center;
    }

    .detail-close {
      position: fixed;
      top: 31px;
      left: 32px;
      z-index: 70;
      cursor: pointer;
    }

    .detail-logo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--cobalt);
      z-index: 65;
      pointer-events: none;
    }

    .detail-left {
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 520px;
    }

    .detail-line-mask {
      overflow: hidden;
    }

    .detail-sub {
      color: var(--cobalt);
    }

    .detail-title {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(44px, 5.4vw, 84px);
      line-height: 1;
      letter-spacing: -.025em;
    }

    .detail-meta {
      color: var(--muted);
    }

    .detail-synopsis {
      font-family: "Newsreader", Georgia, serif;
      font-size: 17px;
      line-height: 1.5;
      max-width: 42ch;
    }

    .detail-credit {
      font-family: "Newsreader", Georgia, serif;
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
    }

    .detail-watch-btn {
      align-self: flex-start;
      height: 44px;
      padding: 0 20px;
      margin-top: 10px;
      border: 1px solid var(--cobalt);
      color: var(--cobalt);
      background: transparent;
      font-family: "Inter Tight", "Noto Sans JP", sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .detail-watch-btn:hover {
      background: var(--cobalt);
      color: #ffffff;
    }

    .detail-right {
      display: flex;
      justify-content: center;
      align-items: center;
      height: min(100%, 78vh);
    }

    .poster-svg {
      height: min(100%, 78vh);
      aspect-ratio: 474 / 900;
      display: block;
    }

    /* Responsive */
    @media (max-width: 767px) {
      .top-bar { height: 64px; padding: 0 16px; }
      .logo-kanji { font-size: 17px; }
      .logo-sub { font-size: 7.5px; }
      .top-right { display: none; }
      .decade-nav { top: calc(50% - var(--H) / 2 - 70px); }
      .tab-btn { padding: 0 7px; font-size: 9px; }
      .cap-title { font-size: 24px; }
      .arrow-btn.prev { left: 6px; }
      .arrow-btn.next { right: 6px; }
      .footer { left: 16px; right: 16px; bottom: 18px; }
      .detail {
        grid-template-columns: 1fr;
        padding: 84px 22px 40px;
        gap: 24px;
        overflow-y: auto;
      }
      .detail-right { order: -1; height: 46svh; }
      .poster-svg { height: 46svh; }
      .detail-title { font-size: 42px; }
      .detail-synopsis { font-size: 16px; }
      .detail-close { top: 16px; left: 16px; }
      .detail-logo { height: 64px; }
    }
  </style>
</head>
<body>

  <!-- Paper Grain SVG Filter -->
  <svg id="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="grain-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.22 0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-filter)" />
  </svg>

  <!-- 1. Top Bar -->
  <header class="top-bar">
    <div class="top-left">
      <a href="#" class="box lbl" aria-label="Go back">BACK / 戻る</a>
    </div>
    <a href="#" class="top-logo">
      <span class="logo-kanji">莱昂·瓦萨里</span>
      <span class="logo-sub">LEON VASARI</span>
    </a>
    <div class="top-right lbl">
      CAREER 1958年〜1989年
    </div>
  </header>

  <!-- 2. Decade Tabs -->
  <nav class="decade-nav" aria-label="Decades">
    <div class="tabs-wrapper">
      <div id="tab-indicator" class="tab-indicator"></div>
      <button type="button" class="tab-btn" data-decade="all">ALL / すべて</button>
      <button type="button" class="tab-btn" data-decade="1950">1950s</button>
      <button type="button" class="tab-btn" data-decade="1960">1960s</button>
      <button type="button" class="tab-btn" data-decade="1970">1970s</button>
      <button type="button" class="tab-btn" data-decade="1980">1980s</button>
    </div>
  </nav>

  <!-- 3. The Shelf (3D Stage) -->
  <section class="shelf-section" id="shelf" aria-label="Filmography shelf">
    <div class="stage" id="stage"></div>
  </section>

  <!-- 4. Play Ring -->
  <button type="button" id="play-ring" class="play-ring" aria-label="Open film">
    <svg viewBox="0 0 12 14">
      <path d="M0 0 L12 7 L0 14 Z" />
    </svg>
  </button>

  <!-- 5. Caption Stack -->
  <div class="caption-stack" aria-live="polite">
    <div class="caption-mask">
      <h2 id="cap-title" class="cap-title">Noon in Ashes</h2>
    </div>
    <div class="caption-mask">
      <div id="cap-sub" class="cap-sub lbl">HAI NO SHOGO / 灰の正午</div>
    </div>
    <div class="caption-mask">
      <div id="cap-year" class="cap-year">1971</div>
    </div>
  </div>

  <!-- 6. Arrows -->
  <button type="button" id="prev-arrow" class="arrow-btn prev" aria-label="Previous film">
    <svg viewBox="0 0 18 10" width="18" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M5 1 L1 5 L5 9 M1 5 L17 5" />
    </svg>
  </button>
  <button type="button" id="next-arrow" class="arrow-btn next" aria-label="Next film">
    <svg viewBox="0 0 18 10" width="18" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M13 1 L17 5 L13 9 M17 5 L1 5" />
    </svg>
  </button>

  <!-- 7. Footer -->
  <footer class="footer lbl">
    <span>© LEON VASARI. ALL RIGHTS RESERVED.</span>
    <span>
      <a href="#">FB</a> / <a href="#">TW</a>
    </span>
  </footer>

  <!-- 8. Custom Cursor -->
  <div id="cursor">
    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-label">
      <span>OPEN</span>
      <span>開く</span>
    </div>
  </div>

  <!-- 9. Detail Dialog with Ink Blot Mask -->
  <dialog id="detail-dialog" class="detail" role="dialog" aria-modal="true">
    <button type="button" id="detail-close" class="box lbl detail-close" aria-label="Close details">
      CLOSE / 閉じる
    </button>

    <div class="detail-logo">
      <span class="logo-kanji">莱昂·瓦萨里</span>
      <span class="logo-sub">LEON VASARI</span>
    </div>

    <!-- Left Column (Text) -->
    <div class="detail-left">
      <div class="detail-line-mask">
        <div id="dt-sub" class="lbl detail-sub">ROMAJI / KANJI</div>
      </div>
      <div class="detail-line-mask">
        <h2 id="dt-title" class="detail-title">Title</h2>
      </div>
      <div class="detail-line-mask">
        <div id="dt-meta" class="lbl detail-meta">1971 / WESTERN / 112 MIN</div>
      </div>
      <div class="detail-line-mask">
        <p id="dt-synopsis" class="detail-synopsis">Synopsis</p>
      </div>
      <div class="detail-line-mask">
        <p id="dt-credit" class="detail-credit">Written and directed by Leon Vasari. 監督作品</p>
      </div>
      <div class="detail-line-mask">
        <button type="button" class="detail-watch-btn">
          WATCH THE FILM / 映画を見る
        </button>
      </div>
    </div>

    <!-- Right Column (Ink Mask Poster SVG) -->
    <div class="detail-right">
      <svg class="poster-svg" viewBox="0 0 474 900" aria-hidden="true">
        <defs>
          <filter id="ink-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <mask id="ink-mask" maskUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300">
            <g filter="url(#ink-filter)">
              <circle class="ink-blob" cx="150" cy="330" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="340" cy="600" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="250" cy="120" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="90" cy="760" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="400" cy="250" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="260" cy="860" r="0" fill="#ffffff" />
              <circle class="ink-blob" cx="230" cy="470" r="0" fill="#ffffff" />
            </g>
          </mask>
        </defs>
        <g mask="url(#ink-mask)">
          <image id="poster-img" href="" preserveAspectRatio="none" />
        </g>
      </svg>
    </div>
  </dialog>

       LOGIC & MOTION ENGINE

        'cover-observer': ['covers', 915, 815, 342, 675],
        'spine-birds':    ['spines', 1573, 31, 183, 1089],
        'cover-birds':    ['covers', 1331, 815, 345, 675],
        'spine-storm':    ['fix2', 808, 15, 347, 2656],
        'cover-storm':    ['covers', 74, 1571, 345, 681],
        'spine-tide':     ['spines', 2012, 31, 188, 1089],
        'cover-tide':     ['covers', 496, 1577, 343, 678],
        'spine-war':      ['spines', 2236, 31, 189, 1089],
        'cover-war':      ['covers', 913, 1579, 343, 676],
        'spine-door':     ['spines', 2462, 31, 188, 1089],
        'cover-door':     ['covers', 1331, 1579, 344, 677]
      };

      const FILMS = [
        { id: 'valley',   title: 'The Silent Valley', romaji: 'SHIZUKANA TANI', kanji: '静かな谷', year: 1958, genre: 'Drama',   min: 104, synopsis: 'A schoolteacher returns to the mountain village that exiled her father, and finds the valley has kept every one of its secrets.' },
        { id: 'bluehour', title: 'The Blue Hour',     romaji: 'AO NO TOKI',     kanji: '青の刻',   year: 1962, genre: 'Romance', min: 97,  synopsis: 'Over one long evening in a harbour town, a widow and a stranger trade small lies until the light runs out.' },
        { id: 'river',    title: 'River of Salt',     romaji: 'SHIO NO KAWA',   kanji: '塩の川',   year: 1964, genre: 'Drama',   min: 121, synopsis: 'Two brothers drag a salt barge downriver to a city that no longer wants anything they carry.' },
        { id: 'summer',   title: 'The Last Summer',   romaji: 'SAIGO NO NATSU', kanji: '最後の夏', year: 1966, genre: 'Drama',   min: 109, synopsis: 'The summer before the dam floods their village, three friends set fire to everything they cannot take with them.' },
        { id: 'green',    title: 'The Green Road',    romaji: 'MIDORI NO MICHI',kanji: '緑の道',   year: 1969, genre: 'Mystery', min: 101, synopsis: 'A surveyor mapping a forest road keeps finding the same footprints, always one day ahead of him.' },
        { id: 'noon',     title: 'Noon in Ashes',     romaji: 'HAI NO SHOGO',   kanji: '灰の正午', year: 1971, genre: 'Western', min: 112, synopsis: 'A rider crosses a white desert to settle an old debt, and learns too late who sent him.' },
        { id: 'observer', title: 'The Observer',      romaji: 'KANSATSUSHA',    kanji: '観察者',   year: 1973, genre: 'Thriller',min: 96,  synopsis: 'A night watchman begins to suspect that the building he guards has started watching him back.' },
        { id: 'birds',    title: 'The Fallen Birds',  romaji: 'OCHITA TORI',    kanji: '落ちた鳥', year: 1975, genre: 'Drama',   min: 118, synopsis: 'When the birds stop singing over a frontier town, the mayor\'s daughter is the only one who goes looking for the reason.' },
        { id: 'storm',    title: 'Light in the Storm',romaji: 'ARASHI NO HI',   kanji: '嵐の灯',   year: 1978, genre: 'Drama',   min: 127, synopsis: 'A lighthouse keeper and his son wait out a three-day storm with a shipwrecked sailor who will not give his name.' },
        { id: 'tide',     title: 'The Long Tide',     romaji: 'NAGAI SHIO',     kanji: '長い潮',   year: 1981, genre: 'Drama',   min: 99,  synopsis: 'A fisherman\'s wife counts the tides on the harbour wall while her husband\'s boat fails to come home.' },
        { id: 'war',      title: 'A Quiet War',       romaji: 'SHIZUKANA SENSO',kanji: '静かな戦争',year: 1985, genre: 'Comedy',  min: 103, synopsis: 'Two neighbours fight a silent war over a garden wall for thirty years, and neither will say how it began.' },
        { id: 'door',     title: 'Red Door',          romaji: 'AKAI TOBIRA',    kanji: '赤い扉',   year: 1989, genre: 'Thriller',min: 114, synopsis: 'A projectionist follows a reel of unknown film through the corridors of a cinema on its final night.' }
      ];

      // Preload sheets
      Object.values(SHEET).forEach(s => { const img = new Image(); img.src = s[0]; });

      // Elements
      const stage = document.getElementById('stage');
      const tabIndicator = document.getElementById('tab-indicator');
      const tabs = document.querySelectorAll('.tab-btn');
      const capTitle = document.getElementById('cap-title');
      const capSub = document.getElementById('cap-sub');
      const capYear = document.getElementById('cap-year');
      const prevArrow = document.getElementById('prev-arrow');
      const nextArrow = document.getElementById('next-arrow');
      const playRing = document.getElementById('play-ring');
      const cursor = document.getElementById('cursor');

      const detail = document.getElementById('detail-dialog');
      const detailClose = document.getElementById('detail-close');
      const dtSub = document.getElementById('dt-sub');
      const dtTitle = document.getElementById('dt-title');
      const dtMeta = document.getElementById('dt-meta');
      const dtSynopsis = document.getElementById('dt-synopsis');
      const posterImg = document.getElementById('poster-img');
      const inkBlobs = document.querySelectorAll('.ink-blob');

      const BLOB_DELAYS = [0, 120, 220, 300, 360, 420, 180];

      // Dimensions & State
      let H = 0, ws = 0, d = 0, gap = 0, W = window.innerWidth, cy = window.innerHeight / 2;
      let s = 17, T = 17; // starts on Noon in Ashes (5 + 12)
      let activeFilmIdx = 5;
      let mx = W / 2, my = cy, cx = W / 2, cy_curs = cy;
      let tiltX = 0, tiltY = 0;
      let onCover = false;
      let isOpen = false;
      let hoverVirtIdx = -1;
      let liftArr = new Float32Array(36);

      const smoothstep = x => x * x * (3 - 2 * x);

      function updateDims() {
        W = window.innerWidth;
        cy = window.innerHeight / 2;
        const probe = document.createElement('div');
        probe.style.height = 'var(--H)';
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        document.body.appendChild(probe);
        H = probe.clientHeight;
        document.body.removeChild(probe);

        ws = H * (142 / 840);
        d = H * (474 / 900);
        gap = H * 0.03;

        document.documentElement.style.setProperty('--ws', `${ws}px`);
        document.documentElement.style.setProperty('--d', `${d}px`);
      }

      window.addEventListener('resize', () => {
        updateDims();
        updateTabIndicator(activeFilmIdx);
      });
      updateDims();

      // Create 36 Tapes (12 films x 3)
      const tapeElements = [];
      const tapeCovers = [];

      function applyCrop(el, cropKey) {
        const [sheetId, x, y, w, h] = CROP[cropKey];
        const [url, SW, SH] = SHEET[sheetId];
        el.style.backgroundImage = `url(${url})`;
        el.style.backgroundSize = `${(SW / w) * 100}% ${(SH / h) * 100}%`;
        el.style.backgroundPosition = `${(x / (SW - w)) * 100}% ${(y / (SH - h)) * 100}%`;
      }

      for (let v = 0; v < 36; v++) {
        const film = FILMS[v % 12];
        const tape = document.createElement('div');
        tape.className = 'tape';
        tape.dataset.v = v;

        const sp = document.createElement('div');
        sp.className = 'face sp';
        applyCrop(sp, `spine-${film.id}`);

        const cv = document.createElement('div');
        cv.className = 'face cv';
        applyCrop(cv, `cover-${film.id}`);

        tape.appendChild(sp);
        tape.appendChild(cv);
        stage.appendChild(tape);

        tapeElements.push(tape);
        tapeCovers.push(cv);

        tape.addEventListener('pointerenter', () => {
          hoverVirtIdx = v;
        });
        tape.addEventListener('pointerleave', () => {
          if (hoverVirtIdx === v) hoverVirtIdx = -1;
        });
      }

      // ── Decade Tabs ──
      function updateTabIndicator(filmIndex) {
        const film = FILMS[filmIndex];
        const year = film.year;
        let decade = '1950';
        if (year >= 1960 && year < 1970) decade = '1960';
        else if (year >= 1970 && year < 1980) decade = '1970';
        else if (year >= 1980) decade = '1980';

        tabs.forEach(tab => {
          if (tab.dataset.decade === decade) {
            tab.classList.add('active');
            tabIndicator.style.width = `${tab.offsetWidth}px`;
            tabIndicator.style.transform = `translateX(${tab.offsetLeft}px)`;
          } else {
            tab.classList.remove('active');
          }
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const dec = tab.dataset.decade;
          let targetFilm = 0;
          if (dec === '1950') targetFilm = 0; // The Silent Valley
          else if (dec === '1960') targetFilm = 1; // The Blue Hour
          else if (dec === '1970') targetFilm = 5; // Noon in Ashes
          else if (dec === '1980') targetFilm = 9; // The Long Tide

          // Jump shortest distance
          const currentFilm = ((Math.round(s) % 12) + 12) % 12;
          let diff = targetFilm - currentFilm;
          if (diff > 6) diff -= 12;
          if (diff < -6) diff += 12;
          T = Math.round(s) + diff;
        });
      });

      // ── Caption Swapping ──
      function swapText(el, newText, dir) {
        const oldSpan = el.querySelector('span');
        const newSpan = document.createElement('span');
        newSpan.textContent = newText;
        newSpan.style.display = 'inline-block';
        newSpan.style.position = 'relative';

        el.appendChild(newSpan);

        newSpan.animate([
          { transform: `translateY(${dir * 105}%)` },
          { transform: 'translateY(0)' }
        ], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });

        if (oldSpan) {
          oldSpan.style.position = 'absolute';
          oldSpan.style.left = '0';
          oldSpan.style.right = '0';
          const a = oldSpan.animate([
            { transform: 'translateY(0)' },
            { transform: `translateY(${-dir * 105}%)` }
          ], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
          a.onfinish = () => oldSpan.remove();
        }
      }

      function setActive(newIdx, dir = 1) {
        if (newIdx === activeFilmIdx) return;
        activeFilmIdx = newIdx;
        const film = FILMS[activeFilmIdx];
        swapText(capTitle, film.title, dir);
        swapText(capSub, `${film.romaji} / ${film.kanji}`, dir);
        swapText(capYear, `${film.year}`, dir);
        updateTabIndicator(activeFilmIdx);
      }

      // Initial caption set
      capTitle.innerHTML = `<span>${FILMS[5].title}</span>`;
      capSub.innerHTML = `<span>${FILMS[5].romaji} / ${FILMS[5].kanji}</span>`;
      capYear.innerHTML = `<span>${FILMS[5].year}</span>`;
      updateTabIndicator(5);

      // ── Cursor & Pointers ──
      window.addEventListener('pointermove', e => {
        mx = e.clientX;
        my = e.clientY;
      });

      // Dragging on shelf
      let isDragging = false, dragStartX = 0, dragStartT = 0;
      const shelf = document.getElementById('shelf');

      shelf.addEventListener('pointerdown', e => {
        isDragging = false;
        dragStartX = e.clientX;
        dragStartT = T;
        shelf.setPointerCapture(e.pointerId);
      });

      shelf.addEventListener('pointermove', e => {
        if (e.buttons === 0) return;
        const dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 5) {
          isDragging = true;
          T = dragStartT - dx / (ws + gap);
        }
      });

      function stopDrag(e) {
        if (isDragging) {
          T = Math.round(T);
        }
        isDragging = false;
        try { shelf.releasePointerCapture(e.pointerId); } catch (_) {}
      }

      shelf.addEventListener('pointerup', stopDrag);
      shelf.addEventListener('pointercancel', stopDrag);

      // Wheel
      let wheelTimeout = null;
      window.addEventListener('wheel', e => {
        if (isOpen) return;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        T += (delta / (ws + gap)) * 0.5;
        clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(() => {
          T = Math.round(T);
        }, 160);
      }, { passive: true });

      // Arrows & Keyboard
      prevArrow.addEventListener('click', () => { T = Math.round(T) - 1; });
      nextArrow.addEventListener('click', () => { T = Math.round(T) + 1; });

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') { T = Math.round(T) - 1; }
        else if (e.key === 'ArrowRight') { T = Math.round(T) + 1; }
        else if (e.key === 'Enter' && !isOpen) { openDetail(); }
        else if (e.key === 'Escape' && isOpen) { closeDetail(); }
      });

      // Tape Clicks
      tapeElements.forEach((tape, v) => {
        tape.addEventListener('click', () => {
          if (isDragging) return;
          const r = ((v - Math.round(s)) % 36 + 54) % 36 - 18;
          if (Math.abs(r) < 0.5) {
            openDetail();
          } else {
            T = Math.round(T + r);
          }
        });
      });

      playRing.addEventListener('click', openDetail);

      // ── Open & Close Sequence (WAAPI & Ink Bleed) ──
      function openDetail() {
        if (isOpen) return;
        isOpen = true;
        T = Math.round(T);
        s = T;

        const film = FILMS[activeFilmIdx];
        dtSub.textContent = `${film.romaji} / ${film.kanji}`;
        dtTitle.textContent = film.title;
        dtMeta.textContent = `${film.year} / ${film.genre.toUpperCase()} / ${film.min} MIN`;
        dtSynopsis.textContent = film.synopsis;

        // Poster setup
        const [sheetId, cx_box, cy_box, cw, ch] = CROP[`cover-${film.id}`];
        const [url, SW, SH] = SHEET[sheetId];
        posterImg.setAttribute('href', url);
        posterImg.setAttribute('x', `${-cx_box * 474 / cw}`);
        posterImg.setAttribute('y', `${-cy_box * 900 / ch}`);
        posterImg.setAttribute('width', `${SW * 474 / cw}`);
        posterImg.setAttribute('height', `${SH * 900 / ch}`);

        // Reset ink circles
        inkBlobs.forEach(b => b.setAttribute('r', '0'));

        // Read active cover rect
        const activeCoverEl = tapeCovers[Math.round(s) % 36];
        const rect = activeCoverEl ? activeCoverEl.getBoundingClientRect() : { top: cy - H/2, left: W/2 - d/2, width: d, height: H };

        detail.style.visibility = 'visible';
        detail.showModal();

        // Paper sheet growth animation
        detail.animate([
          {
            clipPath: `inset(${rect.top}px ${W - rect.right}px ${window.innerHeight - rect.bottom}px ${rect.left}px round 3px)`,
            transform: 'rotate(-4.5deg)'
          },
          {
            clipPath: 'inset(0px 0px 0px 0px round 0px)',
            transform: 'rotate(0deg)'
          }
        ], {
          duration: 1050,
          easing: 'cubic-bezier(.76,0,.18,1)',
          fill: 'both'
        });

        // Text lines rise
        const maskedLines = detail.querySelectorAll('.detail-line-mask > *');
        maskedLines.forEach((line, idx) => {
          line.animate([
            { transform: 'translateY(110%)' },
            { transform: 'translateY(0)' }
          ], {
            duration: 900,
            delay: 620 + idx * 75,
            easing: 'cubic-bezier(.2,.8,.2,1)',
            fill: 'both'
          });
        });

        // Ink bleed circles expansion
        const startTime = performance.now() + 520;
        function bleedLoop(now) {
          if (!isOpen) return;
          const elapsed = now - startTime;
          if (elapsed > 0) {
            inkBlobs.forEach((blob, i) => {
              const dly = BLOB_DELAYS[i];
              const p = Math.min(1, Math.max(0, (elapsed - dly) / 1250));
              const easeOut = 1 - Math.pow(1 - p, 3);
              blob.setAttribute('r', `${easeOut * 720}`);
            });
          }
          if (elapsed < 2400) {
            requestAnimationFrame(bleedLoop);
          }
        }
        requestAnimationFrame(bleedLoop);
      }

      function closeDetail() {
        if (!isOpen) return;
        isOpen = false;

        const activeCoverEl = tapeCovers[Math.round(s) % 36];
        const rect = activeCoverEl ? activeCoverEl.getBoundingClientRect() : { top: cy - H/2, left: W/2 - d/2, width: d, height: H };

        const anim = detail.animate([
          {
            clipPath: 'inset(0px 0px 0px 0px round 0px)',
            transform: 'rotate(0deg)'
          },
          {
            clipPath: `inset(${rect.top}px ${W - rect.right}px ${window.innerHeight - rect.bottom}px ${rect.left}px round 3px)`,
            transform: 'rotate(-4.5deg)'
          }
        ], {
          duration: 850,
          easing: 'cubic-bezier(.76,0,.18,1)',
          fill: 'both'
        });

        anim.onfinish = () => {
          detail.close();
          detail.style.visibility = 'hidden';
        };
      }

      detailClose.addEventListener('click', closeDetail);

      // ── Main rAF Motion Loop ──
      let lastT = performance.now();

      function tick(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;

        // Spring
        const k = isDragging ? 18 : 5.2;
        s += (T - s) * (1 - Math.exp(-k * dt));
        if (Math.abs(T - s) < 1e-4) s = T;

        // Normalize infinite loop
        if (s > 24) { s -= 12; T -= 12; }
        if (s < 0)  { s += 12; T += 12; }

        // Caption active film tracking
        const currentActive = ((Math.round(s) % 12) + 12) % 12;
        if (currentActive !== activeFilmIdx) {
          const dir = Math.sign(T - s) || 1;
          setActive(currentActive, dir);
        }

        // Smooth Cursor
        cx += (mx - cx) * (1 - Math.exp(-16 * dt));
        cy_curs += (my - cy_curs) * (1 - Math.exp(-16 * dt));
        cursor.style.transform = `translate3d(${cx}px, ${cy_curs}px, 0)`;

        // Check if cursor is on active cover
        onCover = Math.abs(mx - W / 2) < 0.55 * d &&
                  Math.abs(my - cy) < 0.55 * H &&
                  !isOpen &&
                  Math.abs(T - s) < 0.3;

        // Tilt target
        let targetTiltY = 0, targetTiltX = 0;
        if (onCover) {
          targetTiltY = ((mx - W / 2) / (0.55 * d)) * 9;
          targetTiltX = -((my - cy) / (H / 2)) * 6;
        } else {
          targetTiltY = ((mx - W / 2) / W) * 5;
          targetTiltX = 0;
        }
        tiltY += (targetTiltY - tiltY) * (1 - Math.exp(-7 * dt));
        tiltX += (targetTiltX - tiltX) * (1 - Math.exp(-7 * dt));

        // Cursor State classes
        if (onCover) {
          cursor.className = 'open';
        } else if (hoverVirtIdx !== -1 && Math.abs(((hoverVirtIdx - s) % 36 + 54) % 36 - 18) > 0.5) {
          cursor.className = 'spine';
        } else {
          cursor.className = '';
        }

        // Play Ring Positioning & Scale
        const prScale = isOpen ? 0 : smoothstep(Math.max(0, 1 - Math.abs(T - s) * 3));
        const prLeft = W / 2 - 0.5 * d - 6;
        const prTop = cy + 0.36 * H;
        playRing.style.left = `${prLeft}px`;
        playRing.style.top = `${prTop}px`;
        playRing.style.transform = `translate(-50%, -50%) scale(${prScale})`;

        // Render Shelf Tapes
        const B = r => Math.abs(r) < 1 ? (r + Math.sin(Math.PI * r) / Math.PI) / 2 : (r > 0 ? 0.5 : -0.5);

        for (let v = 0; v < 36; v++) {
          const tape = tapeElements[v];
          // relative index r in range [-18, 18]
          const r = ((v - s) % 36 + 54) % 36 - 18;

          // Horizontal placement formula
          const x = r * (ws + gap) + (d - ws + 1.6 * gap) * B(r);

          // Culling
          if (Math.abs(x) > W / 2 + 1.5 * d) {
            tape.style.visibility = 'hidden';
            continue;
          }
          tape.style.visibility = 'visible';

          // Hover lift ease
          const targetLift = (hoverVirtIdx === v && Math.abs(r) > 0.5) ? 1 : 0;
          liftArr[v] += (targetLift - liftArr[v]) * (1 - Math.exp(-12 * dt));

          // Openness o
          const o = smoothstep(Math.max(0, 1 - Math.abs(r)));

          const rotY = -90 * o + tiltY * o;
          const rotX = tiltX * o;
          const rotZ = -4.5 * o;
          const transZ = o * 0.2 * H;
          const transY = -o * 0.025 * H - liftArr[v] * 0.045 * H;

          tape.style.transform = `translate3d(${x}px, ${transY}px, ${transZ}px) rotateZ(${rotZ}deg) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
          tape.style.zIndex = Math.round(100 - Math.abs(r) * 4);

          // Shading overlay
          const spFace = tape.children[0];
          const cvFace = tape.children[1];
          spFace.style.setProperty('--shade', o * 0.55);
          cvFace.style.setProperty('--shade', (1 - o) * 0.5);
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
