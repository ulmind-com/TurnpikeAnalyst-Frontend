  <!-- ═══════════════════════════════════════
       INTERACTION SCRIPT (DRAWER & rAF MARQUEE)
       ═══════════════════════════════════════ -->
  <script>
    (function() {
      // ----------------------------------------------------
      // 1. DRAWER & MENU INTERACTIONS
      // ----------------------------------------------------
      const openBtn = document.getElementById('open-menu-btn');
      const closeBtn = document.getElementById('close-menu-btn');
      const overlay = document.getElementById('menu-overlay');
      const drawer = document.getElementById('menu-drawer');
      const closeLineA = document.getElementById('close-line-a');
      const closeLineB = document.getElementById('close-line-b');
      const navLinks = document.querySelectorAll('.menu-nav-link');
      const drawerCta = document.getElementById('drawer-cta');

      function openMenu() {
        document.body.style.overflow = 'hidden';
        
        // Show overlay
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto');

        // Show drawer (Mobile: translate-y-0, Desktop: sm:translate-x-0)
        drawer.classList.remove('opacity-0', 'translate-y-full', 'sm:translate-x-full');
        drawer.classList.add('opacity-100', 'translate-y-0', 'sm:translate-x-0');

        // Morph close button into X
        closeLineA.classList.remove('-translate-y-[3px]', 'rotate-0');
        closeLineA.classList.add('rotate-45');
        closeLineB.classList.remove('translate-y-[3px]', 'rotate-0');
        closeLineB.classList.add('-rotate-45');

        // Animate staggered nav links
        navLinks.forEach(link => {
          link.classList.remove('opacity-0', 'translate-x-8');
          link.classList.add('opacity-100', 'translate-x-0');
        });

        // Animate CTA
        drawerCta.classList.remove('opacity-0', 'translate-y-4');
        drawerCta.classList.add('opacity-100', 'translate-y-0');
      }

      function closeMenu() {
        document.body.style.overflow = '';

        // Hide overlay
        overlay.classList.remove('opacity-100', 'pointer-events-auto');
        overlay.classList.add('opacity-0', 'pointer-events-none');

        // Hide drawer
        drawer.classList.remove('opacity-100', 'translate-y-0', 'sm:translate-x-0');
        drawer.classList.add('opacity-0', 'translate-y-full', 'sm:translate-x-full');

        // Morph close button back
        closeLineA.classList.remove('rotate-45');
        closeLineA.classList.add('-translate-y-[3px]', 'rotate-0');
        closeLineB.classList.remove('-rotate-45');
        closeLineB.classList.add('translate-y-[3px]', 'rotate-0');

        // Reset nav links
        navLinks.forEach(link => {
          link.classList.remove('opacity-100', 'translate-x-0');
          link.classList.add('opacity-0', 'translate-x-8');
        });

        // Reset CTA
        drawerCta.classList.remove('opacity-100', 'translate-y-0');
        drawerCta.classList.add('opacity-0', 'translate-y-4');
      }

      openBtn.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      overlay.addEventListener('click', closeMenu);
      navLinks.forEach(link => link.addEventListener('click', closeMenu));

      // ----------------------------------------------------
      // 2. REQUEST ANIMATION FRAME MARQUEE ENGINE (DRAG + INERTIA)
      // ----------------------------------------------------
      const container = document.getElementById('marquee-container');
      const track = document.getElementById('marquee-track');

      const SPEED = 0.8; // px per frame auto-scroll
      let offset = 0;
      let velocity = 0;
      let isDragging = false;
      let dragStartX = 0;
      let dragStartOffset = 0;
      let lastClientX = 0;
      let lastTime = 0;

      // Pointer drag interaction with setPointerCapture
      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        velocity = 0;
        dragStartX = e.clientX;
        dragStartOffset = offset;
        lastClientX = e.clientX;
        lastTime = performance.now();
        container.setPointerCapture(e.pointerId);
        container.classList.remove('cursor-grab');
        container.classList.add('cursor-grabbing');
      });

      container.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const now = performance.now();
        const dt = Math.max(1, now - lastTime);
        const dx = e.clientX - lastClientX;
        
        velocity = (dx / dt) * 16; // normalize to ~60fps
        lastClientX = e.clientX;
        lastTime = now;

        offset = dragStartOffset + (e.clientX - dragStartX);
      });

      function stopDragging(e) {
        if (!isDragging) return;
        isDragging = false;
        try {
          container.releasePointerCapture(e.pointerId);
        } catch (_) {}
        container.classList.remove('cursor-grabbing');
        container.classList.add('cursor-grab');
      }

      container.addEventListener('pointerup', stopDragging);
      container.addEventListener('pointercancel', stopDragging);

      // Animation loop
      function tick() {
        const halfWidth = track.scrollWidth / 2;

        if (isDragging) {
          // While dragging, offset is calculated from pointermove
        } else {
          // Inertia coasting & auto-scroll
          if (Math.abs(velocity) > 0.1) {
            offset += velocity;
            velocity *= 0.95; // momentum decay
          } else {
            velocity = 0;
            offset -= SPEED; // resume left auto-scroll
          }
        }

        // Seamless wrap around half-width
        if (halfWidth > 0) {
          if (offset <= -halfWidth) {
            offset += halfWidth;
            if (isDragging) dragStartOffset += halfWidth;
          } else if (offset > 0) {
            offset -= halfWidth;
            if (isDragging) dragStartOffset -= halfWidth;
          }
        }

        track.style.transform = `translate3d(${offset}px, 0, 0)`;
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
